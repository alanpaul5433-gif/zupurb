name: zupurb_app
description: "Zupurb - Discover. Review. Reward."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  gap: ^3.0.1
  intl: ^0.20.2
  google_maps_flutter: ^2.9.0
  google_places_flutter: ^2.0.8
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  purchases_flutter: ^10.0.1   # RevenueCat Flutter SDK (I6 — IAP/subscriptions)
  firebase_messaging: ^15.1.3  # FCM push notifications (I6)
  flutter_local_notifications: ^18.0.1  # Foreground notification display (I6)
  app_links: ^6.3.2             # Deep linking — Android App Links + iOS Universal Links (I10)
  shared_preferences: ^2.3.3   # Used by DeepLinkService to store pending_referral_code (I10)
  firebase_crashlytics: ^4.1.3  # Crash reporting + non-fatal error logging (I12)
  firebase_analytics: ^11.3.3  # Firebase Analytics — screen tracking, custom events (I11)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
