name: zupurb_app
description: "Zupurb - Discover. Review. Reward."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  gap: ^3.0.1
  intl: ^0.20.2
  google_maps_flutter: ^2.9.0
  google_places_flutter: ^2.0.8
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  purchases_flutter: ^10.0.1   # RevenueCat Flutter SDK (I6 — IAP/subscriptions)
  firebase_messaging: ^15.1.3  # FCM push notifications (I6)
  flutter_local_notifications: ^18.0.1  # Foreground notification display (I6)
  app_links: ^6.3.2             # Deep linking — Android App Links + iOS Universal Links (I10)
  shared_preferences: ^2.3.3   # Used by DeepLinkService to store pending_referral_code (I10)
  uuid: ^4.5.1                  # idempotencyKey (UUID v4) for redeemDeal / createReservation (Tier 2)
  image_picker: ^1.1.2         # Pick review verification photos (web + mobile) (Tier 3)
  qr_flutter: ^4.1.0           # Render redemption + reservation QR codes (Tier 2)
  firebase_crashlytics: ^4.1.3  # Crash reporting + non-fatal error logging (I12)
  firebase_analytics: ^11.3.3  # Firebase Analytics — screen tracking, custom events (I11)
  sign_in_with_apple: ^6.1.3   # Apple Sign-In — required by App Store when Google login is present (D6/T9)
  google_sign_in: ^6.2.2        # Google Sign-In (I1 — social auth)
  flutter_facebook_auth: ^7.1.1 # Facebook Sign-In (I1 — social auth)
  app_tracking_transparency: ^2.0.6  # ATT prompt — required before Firebase Analytics fires on iOS (D6/T9)
  url_launcher: ^6.3.0          # Open Privacy Policy / ToS URLs in external browser (T9)
  firebase_storage: ^12.3.7     # Firebase Cloud Storage — profile/review/establishment photos (I2)
  flutter_image_compress: ^2.3.0 # Client-side JPEG compression before Storage upload (I2)
  http: ^1.2.2                   # HTTP client for Google Places API calls (I3)
  algolia_helper_flutter: ^1.0.0 # Algolia Flutter helper — multi-index search client (I3)
  permission_handler: ^11.3.1    # Runtime permission requests — location, notifications (I3)
  flutter_branch_sdk: ^7.0.0    # Branch.io deep linking — shareable links + referral attribution (I10)
  share_plus: ^10.0.0            # OS-level share sheet — used by ShareService to share Branch links (I10)
  fpjs_pro_plugin: ^4.9.0        # FingerprintJS Pro — device fingerprinting for anti-fraud (I11)
  mixpanel_flutter: ^2.3.3       # Mixpanel product analytics — dual-tracked alongside Firebase Analytics (I12)
  flutter_map: ^8.1.1            # Embedded OSM map tiles — no API key required
  latlong2: ^0.9.1               # LatLng value type for flutter_map markers

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Provides setupFirebaseCoreMocks() for the shared test harness (QA-4/QA-5a).
  firebase_core_platform_interface: ^6.0.0

  # patrol: CLI tool installed separately via 'dart pub global activate patrol_cli'
  # Run tests with: patrol test
  patrol: ^3.15.0

  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
  generate: true
