name: Beta Distribution

# ---------------------------------------------------------------------------
# T10 / D3-D4 — Beta Distribution
# ---------------------------------------------------------------------------
# Distributes beta builds to:
#   Android → Firebase App Distribution (internal-qa tester group)
#   iOS     → TestFlight (internal + external testers)
#
# Required GitHub Actions secrets:
#
#   Android (Firebase App Distribution):
#     FIREBASE_APP_ID_ANDROID        — Firebase Android App ID (1:xxx:android:yyy)
#     FIREBASE_SERVICE_ACCOUNT_JSON  — Service-account JSON with Firebase App Distribution Admin role
#     ANDROID_KEYSTORE_BASE64        — base64-encoded upload keystore (.jks)
#     KEYSTORE_PASSWORD              — keystore password
#     KEY_ALIAS                      — key alias
#     KEY_PASSWORD                   — key password
#
#   iOS (TestFlight):
#     APP_STORE_API_KEY_ID           — App Store Connect API key ID
#     APP_STORE_API_KEY_ISSUER_ID    — App Store Connect issuer ID
#     APP_STORE_API_KEY_CONTENT      — Full contents of the .p8 private key file
#     MATCH_GIT_URL                  — HTTPS/SSH URL of private Fastlane match certs repo
#     MATCH_PASSWORD                 — match encryption passphrase
#     APPLE_TEAM_ID                  — 10-character Apple Developer Team ID
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build and distribute"
        required: true
        default: "both"
        type: choice
        options:
          - android
          - ios
          - both
      release_notes:
        description: "Release notes for this beta build (shown to testers)"
        required: false
        default: "Beta build — see commit history for changes."
        type: string

  push:
    branches:
      - beta

concurrency:
  group: "beta-${{ github.ref }}"
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# ANDROID JOB
# ---------------------------------------------------------------------------
jobs:
  android:
    name: Android — Build & Distribute (Firebase App Distribution)
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zupurb_app

    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # Fail fast — do not distribute a build with failing tests
      - name: Run unit and widget tests
        run: flutter test

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          echo "KEYSTORE_PATH=/tmp/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=staging

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: internal-qa
          file: zupurb_app/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.inputs.release_notes || 'Beta build from beta branch push.' }}

      - name: Shred keystore from runner
        if: always()
        run: shred -u /tmp/upload-keystore.jks || rm -f /tmp/upload-keystore.jks

  # ---------------------------------------------------------------------------
  # iOS JOB
  # ---------------------------------------------------------------------------
  ios:
    name: iOS — Build & Distribute (TestFlight)
    if: ${{ github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zupurb_app

    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Fail fast — do not distribute a build with failing tests
      - name: Run unit and widget tests
        run: flutter test

      - name: Install Ruby gems (Fastlane)
        working-directory: zupurb_app/ios
        run: |
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3

      - name: Sync provisioning profiles via Fastlane match
        working-directory: zupurb_app/ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
        run: bundle exec fastlane sync_certs

      - name: Build release IPA
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: flutter build ipa --release --export-options-plist ios/ExportOptions.plist --dart-define=APP_ENV=staging

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: zupurb_app/build/ios/ipa/Zupurb.ipa
          issuer-id: ${{ secrets.APP_STORE_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_API_KEY_CONTENT }}
