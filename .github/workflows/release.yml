name: Release

# ---------------------------------------------------------------------------
# D2 — Signing & Beta Distribution
# D7/D9 — Staged Rollout
# ---------------------------------------------------------------------------
# Required GitHub Actions secrets:
#
#   Android signing:
#     ANDROID_KEYSTORE_BASE64    — base64-encoded .jks upload keystore
#                                  Generate: base64 -i upload.jks | pbcopy
#     KEYSTORE_PASSWORD          — keystore password
#     KEY_ALIAS                  — key alias (e.g. "upload")
#     KEY_PASSWORD               — key password
#     PLAY_STORE_JSON_KEY        — contents of Play Console service-account JSON
#
#   iOS signing:
#     MATCH_GIT_URL              — HTTPS/SSH URL of private Fastlane match certs repo
#     MATCH_PASSWORD             — match encryption passphrase
#     APPLE_ID                   — Apple ID email
#     APPLE_TEAM_ID              — 10-character Apple Developer Team ID
#     ITC_TEAM_ID                — App Store Connect numeric team ID
#     APP_STORE_CONNECT_API_KEY_ID     — Key ID from App Store Connect > API Keys
#     APP_STORE_CONNECT_ISSUER_ID      — Issuer ID from App Store Connect > API Keys
#     APP_STORE_CONNECT_PRIVATE_KEY    — Full contents of the .p8 private key file
#
#   Staged rollout automation (D9 — used if rollout promotion is scripted):
#     PLAY_STORE_JSON_KEY        — same service account as above; also used for
#                                  Play Developer API rollout percentage updates
#     APP_STORE_CONNECT_API_KEY_ID     — same as above; used by Fastlane deliver
#     APP_STORE_CONNECT_ISSUER_ID      — same as above
#     APP_STORE_CONNECT_PRIVATE_KEY    — same as above
#
# Notes:
#   - android-release: AAB is uploaded to Play Internal Testing (0% rollout).
#     Promote to production via Play Console manually after QA sign-off.
#   - ios-release: IPA is uploaded to TestFlight (internal testers only).
#     Promote to external testing / App Store in App Store Connect.
#
# ---------------------------------------------------------------------------
# Staged Rollout Plan (see docs/STAGED_ROLLOUT.md for full gate criteria)
# ---------------------------------------------------------------------------
# Week 1:  1% (Play manual) / Day 1-2 App Store phased release
#          Gate: crash-free rate >99.5%, ANR rate <0.5%, no P0 bugs
# Week 2: 10% (Play manual)
#          Gate: same + D1 retention measured
# Week 3: 25% (Play manual) / App Store ~66% automatic
#          Gate: same + ratings >=4.2 stars, no critical 1-star bug reports
# Week 4: 100% (Play manual) / App Store Day 7 automatic
#          Gate: all prior gates green
#
# Rollback triggers (halt immediately if any are hit):
#   - Crash-free rate drops below 98% (crash rate >2%)
#   - Any confirmed P0 bug in production
#   - IAP billing failure rate >1%
#   - Any confirmed Firestore data loss or corruption
#   - App Check bypass confirmed in production
#
# To halt Play rollout: Play Console -> Production -> Manage release -> Halt rollout
# To pause App Store:   App Store Connect -> Version -> Phased Release -> Pause
# Full procedures:      docs/ROLLBACK_PROCEDURES.md
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build_android:
    name: Build Android (release APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zupurb_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: zupurb_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build_ios:
    name: Build iOS (no-codesign, release)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zupurb_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - run: flutter pub get

      - name: Build iOS (compile check, no signing)
        # Real IPA signing is handled by the beta/submission Fastlane lanes (D4/D7).
        # This job validates the release build compiles cleanly on every tag push.
        run: flutter build ios --no-codesign --release --dart-define=APP_ENV=production

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: zupurb_app/build/ios/
          retention-days: 30

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          # Determine previous tag
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          RANGE="${PREV_TAG}..HEAD"

          # Collect commits
          COMMITS="$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || true)"

          # Categorise
          FEAT=""; FIX=""; INFRA=""; TEST_OUT=""; OTHER=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            subject="${line#- }"
            if [[ "$subject" == feat:* || "$subject" == "feat("* ]]; then
              FEAT="${FEAT}${line}"$'\n'
            elif [[ "$subject" == fix:* || "$subject" == "fix("* ]]; then
              FIX="${FIX}${line}"$'\n'
            elif [[ "$subject" == deploy:* || "$subject" == ci:* || "$subject" == "ci("* || "$subject" == "deploy("* ]]; then
              INFRA="${INFRA}${line}"$'\n'
            elif [[ "$subject" == test:* || "$subject" == "test("* ]]; then
              TEST_OUT="${TEST_OUT}${line}"$'\n'
            else
              OTHER="${OTHER}${line}"$'\n'
            fi
          done <<< "$COMMITS"

          # Build body
          BODY="# Release Notes — ${CURRENT_TAG}"$'\n'$'\n'
          BODY+="_Changes since ${PREV_TAG}_"$'\n'$'\n'
          [[ -n "$FEAT" ]]     && BODY+="## New Features"$'\n'$'\n'"${FEAT}"$'\n'
          [[ -n "$FIX" ]]      && BODY+="## Bug Fixes"$'\n'$'\n'"${FIX}"$'\n'
          [[ -n "$INFRA" ]]    && BODY+="## Infrastructure"$'\n'$'\n'"${INFRA}"$'\n'
          [[ -n "$TEST_OUT" ]] && BODY+="## Testing"$'\n'$'\n'"${TEST_OUT}"$'\n'
          [[ -n "$OTHER" ]]    && BODY+="## Other Changes"$'\n'$'\n'"${OTHER}"$'\n'
          [[ -z "$COMMITS" ]]  && BODY+="_No commits found in range._"$'\n'

          # Write to file for the release action (avoids shell quoting issues)
          printf '%s' "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Zupurb ${{ github.ref_name }}"
          body_path: ${{ steps.release_notes.outputs.body_file }}
          files: /tmp/artifacts/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # android-release — Sign AAB and upload to Play Internal Testing
  # Android AAB is uploaded to Internal Testing (0% rollout).
  # Promote to production via Play Console manually after QA sign-off.
  # -------------------------------------------------------------------------
  android-release:
    name: Android — Sign & Upload to Play Internal Testing
    runs-on: ubuntu-latest
    needs: [build_android]
    defaults:
      run:
        working-directory: zupurb_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          echo "KEYSTORE_PATH=/tmp/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=production

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=APP_ENV=production

      - name: Upload AAB to Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.zupurb.app
          releaseFiles: zupurb_app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Shred keystore from runner
        if: always()
        run: shred -u /tmp/upload-keystore.jks || rm -f /tmp/upload-keystore.jks

  # -------------------------------------------------------------------------
  # ios-release — Build IPA with Fastlane match signing and upload to TestFlight
  # -------------------------------------------------------------------------
  ios-release:
    name: iOS — Build IPA & Upload to TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zupurb_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('zupurb_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install Ruby gems (Fastlane)
        working-directory: zupurb_app/ios
        run: |
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3

      - run: flutter pub get

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/asc_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Sync provisioning profiles via Fastlane match
        working-directory: zupurb_app/ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          CI: "true"
        run: bundle exec fastlane sync_certs

      - name: Build release IPA
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: flutter build ipa --release --export-options-plist ios/ExportOptions.plist --dart-define=APP_ENV=production

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: zupurb_app/build/ios/ipa/Zupurb.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Clean up API key
        if: always()
        run: rm -rf /tmp/asc_keys
